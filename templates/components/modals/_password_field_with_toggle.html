{% load i18n %}
<label
  for="{{ field_id }}"
  class="block text-[16px] font-bold leading-[16px] text-[color:var(--color-black-80)]"
>
  {{ label }}
</label>
<div class="relative mt-[15px]" data-password-field>
  <input
    id="{{ field_id }}"
    type="password"
    name="{{ field_name }}"
    autocomplete="{{ autocomplete }}"
    class="modal-input modal-input--password-toggle w-full"
    required
  />
  <button
    type="button"
    tabindex="-1"
    class="password-toggle-btn"
    data-password-toggle
    data-label-show="{% trans 'Показать пароль' %}"
    data-label-hide="{% trans 'Скрыть пароль' %}"
    aria-label="{% trans 'Показать пароль' %}"
    aria-pressed="false"
  >
    <svg
      class="password-toggle-icon"
      data-password-toggle-icon="hidden"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path
        d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.75" />
    </svg>
    <svg
      class="password-toggle-icon hidden"
      data-password-toggle-icon="visible"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path
        d="M3 3L21 21"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
      />
      <path
        d="M10.58 10.58C10.21 10.95 10 11.45 10 12C10 13.1 10.9 14 12 14C12.55 14 13.05 13.79 13.42 13.42"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M6.71 6.71C4.66 8.17 3.29 10.29 2 12C2 12 5.5 19 12 19C13.77 19 15.29 18.38 16.53 17.47M9.88 5.09C10.57 5.03 11.28 5 12 5C18.5 5 22 12 22 12C21.27 13.45 20.22 14.72 18.93 15.75"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</div>
<p data-field-error="{{ error_name }}" class="mt-2 hidden text-sm text-red-700"></p>
